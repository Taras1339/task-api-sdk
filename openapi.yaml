openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: |
    REST API of a task management system. It lets clients manage **projects**
    and the **tasks** that belong to them.

    Authentication is done with a JWT bearer token (see the *Authorization* page)
    or with an API key sent in the `X-API-Key` header.
  contact:
    name: Taras Artiukh
    email: taras@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.taskmanager.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Projects
    description: Create and manage projects
  - name: Tasks
    description: Create and manage tasks inside projects
security:
  - bearerAuth: []
  - apiKeyAuth: []
paths:
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      description: Returns a paginated list of projects available to the current user.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
            example:
              name: Website redesign
              description: New landing page and blog
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project by ID
      responses:
        "200":
          description: The requested project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: Deletes the project together with all of its tasks.
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks of a project
      parameters:
        - name: status
          in: query
          description: Return only tasks with this status
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              title: Prepare mockups
              priority: high
              dueDate: "2026-12-01"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task by ID
      responses:
        "200":
          description: The requested task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      responses:
        "204":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /tasks/{taskId}/status:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      tags: [Tasks]
      operationId: changeTaskStatus
      summary: Change task status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token in the `Authorization` header.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Personal API key.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Project identifier
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task identifier
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Page number, starting from 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
      description: Current state of a task
    Priority:
      type: string
      enum: [low, medium, high]
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: Website redesign
        description:
          type: string
          example: New landing page and blog
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 1
            createdAt:
              type: string
              format: date-time
              readOnly: true
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
          example: Prepare mockups
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: string
          format: date
          example: "2026-12-01"
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          required: [id, projectId, status, createdAt]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 10
            projectId:
              type: integer
              format: int64
              readOnly: true
              example: 1
            createdAt:
              type: string
              format: date-time
              readOnly: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found
